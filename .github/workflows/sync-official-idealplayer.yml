name: Restore missing files from official IdealPlayer

on:
  push:
    branches:
      - sync/idealplayer-official-missing-files
    paths:
      - .github/workflows/sync-official-idealplayer.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Download official source
        run: git clone --depth 1 https://github.com/meliherenn/IdealPlayer.git /tmp/official-idealplayer

      - name: Add missing files only
        shell: bash
        run: |
          rsync -a --ignore-existing --exclude='.git/' --exclude='.github/workflows/android.yml' /tmp/official-idealplayer/ ./
          rm -f .github/workflows/sync-official-idealplayer.yml
          git add -A
          ADDED="$(git diff --cached --diff-filter=A --name-only | wc -l | tr -d ' ')"
          echo "Official files added: $ADDED"
          if [ "$ADDED" -ne 156 ]; then
            echo "Expected 156 missing files (workflow will be added separately), found $ADDED"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: restore 156 missing files from official IdealPlayer"
          git push origin "HEAD:${GITHUB_REF_NAME}"
